<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Mir4Local: MIR4 boss spawn countdowns and reminders">
  <style>
    .t { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes sweep { from { transform: translateX(-340px); } to { transform: translateX(1240px); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .dot { animation: pulse 1.6s ease-in-out infinite; }
    .shine { animation: sweep 6s linear infinite; }
    .card { animation: float 5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .dot, .card { animation: none; } .shine { display: none; } }
  </style>
  <defs>
    <linearGradient id="bgb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171c23"/><stop offset="1" stop-color="#0b0d10"/></linearGradient>
    <linearGradient id="goldb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4e0b0"/><stop offset=".5" stop-color="#c9a46b"/><stop offset="1" stop-color="#87622a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4e0b0"/><stop offset=".5" stop-color="#c9a46b"/><stop offset="1" stop-color="#87622a"/></linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f1f3f6"/><stop offset="1" stop-color="#c3cad2"/></linearGradient>
    <linearGradient id="steelR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9ca5af"/><stop offset="1" stop-color="#69727d"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#252c36"/><stop offset="1" stop-color="#090b0f"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9a46b" stop-opacity="0"/><stop offset=".5" stop-color="#f4e0b0" stop-opacity=".16"/><stop offset="1" stop-color="#c9a46b" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect width="1200" height="300" rx="22"/></clipPath>
    <g id="sword">
      <path d="M256 62 L235 116 V302 H256 Z" fill="url(#steelL)"/>
      <path d="M256 62 L277 116 V302 H256 Z" fill="url(#steelR)"/>
      <rect x="252" y="122" width="8" height="168" rx="4" fill="#090b0f" opacity=".3"/>
      <path d="M186 302 H326 a9 9 0 0 1 9 9 v7 a9 9 0 0 1 -9 9 H186 a9 9 0 0 1 -9 -9 v-7 a9 9 0 0 1 9 -9 Z" fill="url(#gold)"/>
      <rect x="244" y="327" width="24" height="70" rx="6" fill="#5e431b"/>
      <rect x="244" y="342" width="24" height="5" fill="#c9a46b" opacity=".7"/>
      <rect x="244" y="358" width="24" height="5" fill="#c9a46b" opacity=".7"/>
      <rect x="244" y="374" width="24" height="5" fill="#c9a46b" opacity=".7"/>
      <circle cx="256" cy="410" r="18" fill="url(#gold)"/>
    </g>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bgb)"/>
    <rect class="shine" x="0" y="0" width="340" height="300" fill="url(#sheen)"/>
    <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="url(#goldb)" stroke-opacity=".55" stroke-width="2"/>
  </g>

  <g transform="translate(62 62) scale(.34)">
    <rect width="512" height="512" rx="112" fill="url(#bg)"/>
    <rect x="12" y="12" width="488" height="488" rx="102" fill="none" stroke="url(#gold)" stroke-width="7"/>
    <circle cx="256" cy="256" r="178" fill="none" stroke="url(#gold)" stroke-width="4" opacity=".38"/>
    <use href="#sword" transform="rotate(-45 256 256)"/>
    <use href="#sword" transform="rotate(45 256 256)"/>
    <circle cx="256" cy="256" r="25" fill="#0e1116" stroke="url(#gold)" stroke-width="6"/>
  </g>

  <text class="t" x="262" y="136" font-size="68" font-weight="800" fill="#ece9e2" letter-spacing="-1">Mir4Local</text>
  <text class="t" x="264" y="182" font-size="23" fill="#9aa0a8">Boss spawn countdowns, reminders and checklists.</text>
  <text class="t" x="264" y="226" font-size="14" font-weight="700" fill="#c9a46b" letter-spacing="2">WINDOWS · MACOS · LINUX · BROWSER · 12 LANGUAGES</text>

  <g class="card">
    <rect x="860" y="62" width="278" height="82" rx="12" fill="#14181d" stroke="#2c333b"/>
    <rect x="860" y="62" width="5" height="82" rx="2" fill="#f08a55"/>
    <text class="t" x="884" y="96" font-size="16" font-weight="700" fill="#f08a55">Boltox spawns in 5 minutes</text>
    <text class="t" x="884" y="122" font-size="13" fill="#9aa0a8">Mirage Ship, Layer 3</text>
    <rect x="860" y="166" width="278" height="82" rx="12" fill="#14181d" stroke="#2c333b"/>
    <rect x="860" y="166" width="5" height="82" rx="2" fill="#5fc48a"/>
    <circle class="dot" cx="1118" cy="187" r="5" fill="#5fc48a"/>
    <text class="t" x="884" y="200" font-size="16" font-weight="700" fill="#5fc48a">Yiun has spawned</text>
    <text class="t" x="884" y="226" font-size="13" fill="#9aa0a8">Mirage Ship, Layer 1</text>
  </g>
</svg>
